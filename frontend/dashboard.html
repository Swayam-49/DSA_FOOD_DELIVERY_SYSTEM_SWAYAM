<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QuickBites</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Dynamically Loaded Navbar -->
    <div id="navbar-container"></div>

    <!-- Dashboard Title Banner -->
    <section class="bg-dark text-white py-4 mb-5" style="background-color: var(--primary-light) !important;">
        <div class="container">
            <h2 class="fw-bold m-0" id="dashboard-title">Dashboard</h2>
        </div>
    </section>

    <!-- Main Dashboard Work Area -->
    <main class="container mb-5 flex-grow-1">
        <div id="dashboard-content">
            <!-- Dynamically populated depending on who is logged in (Customer, Restaurant, Delivery Partner) -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-secondary">Loading dashboard...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 QuickBites. College Project.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom app JS -->
    <script src="js/app.js"></script>
</body>
</html>
