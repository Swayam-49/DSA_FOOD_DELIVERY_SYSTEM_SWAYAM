<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - QuickBites</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom style -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Dynamically Loaded Navbar -->
    <div id="navbar-container"></div>

    <main class="container my-5 flex-grow-1">
        <h2 class="fw-bold mb-4">Food Cart</h2>

        <div class="row">
            <!-- Cart Items List -->
            <div class="col-lg-8 mb-4" id="cart-items-container">
                <!-- Dynamically populated via JS -->
            </div>

            <!-- Summary Panel -->
            <div class="col-lg-4" id="cart-summary-card" style="display: none;">
                <div class="card-premium p-4 shadow-sm">
                    <h5 class="fw-bold mb-4">Order Summary</h5>

                    <!-- Coupon code input -->
                    <form id="coupon-form" class="mb-4">
                        <label class="form-label small fw-bold">Promo Coupon Code</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="coupon-code"
                                placeholder="e.g. QUICK10, EATS20, BITE50" style="border-radius: 8px 0 0 8px;">
                            <button class="btn btn-outline-dark" type="submit"
                                style="border-radius: 0 8px 8px 0;">Apply</button>
                        </div>
                        <div class="form-text small mt-1">Available coupons: <code>QUICK10</code> (10%),
                            <code>EATS20</code> (20%), <code>BITE50</code> (50% max $15).</div>
                    </form>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <span class="fw-semibold text-dark" id="subtotal-val">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2 text-success" id="discount-row"
                        style="display: none;">
                        <span>Discount Applied</span>
                        <span class="fw-bold" id="discount-val">-$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4 pt-3 border-top">
                        <span class="fw-bold">Total Price</span>
                        <span class="fw-bold text-accent font-monospace fs-5" id="total-val"
                            style="color: var(--accent-color);">$0.00</span>
                    </div>

                    <button class="btn btn-accent w-100 py-3 fw-bold" id="checkout-btn">
                        Place Order
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 QuickBites. Food Delivery Project.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom app JS -->
    <script src="js/app.js"></script>
</body>

</html>
