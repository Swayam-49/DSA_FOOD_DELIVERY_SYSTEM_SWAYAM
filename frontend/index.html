<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBites - Local Food Delivery</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom style -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Dynamically Loaded Navbar -->
    <div id="navbar-container"></div>

    <!-- Hero Section -->
    <section class="hero-section text-center">
        <div class="container">
            <h1 class="hero-title mb-3 text-white">Delicious Food, <span style="color: var(--accent-color)">Delivered
                    Fast</span></h1>
            <p class="hero-subtitle mb-5 mx-auto" style="max-width: 600px;">
                Order from your local favourites and track your delivery in real-time.
            </p>

            <!-- Search Bar Container -->
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="search-container d-flex align-items-center">
                        <input type="text" id="search-input" class="search-input"
                            placeholder="Search for your favourite restaurant...">
                        <button class="btn btn-accent px-4 py-2" id="search-btn">Search</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Content Section -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Browse Restaurants</h3>

            <!-- Sort Selector -->
            <div class="d-flex align-items-center gap-2" style="width: 250px;">
                <label for="sort-select" class="small text-secondary fw-semibold text-nowrap m-0">Sort By:</label>
                <select id="sort-select" class="form-select form-select-sm border-2" style="border-radius: 8px;">
                    <option value="name">Name (A-Z)</option>
                    <option value="rating">Highest Rating</option>
                    <option value="deliveryTime">Fastest Delivery</option>
                </select>
            </div>
        </div>

        <!-- Restaurant list grid -->
        <div class="row" id="restaurant-list">
            <!-- Dynamically populated via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-1">&copy; 2026 QuickBites. Food Delivery Project.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom app JS -->
    <script src="js/app.js"></script>
</body>

</html>
