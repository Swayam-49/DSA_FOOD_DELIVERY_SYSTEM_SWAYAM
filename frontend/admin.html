<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - QuickBites</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Dynamically Loaded Navbar -->
    <div id="navbar-container"></div>

    <!-- Admin Header -->
    <section class="bg-dark text-white py-4 mb-5" style="background-color: #0f172a !important;">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="fw-bold m-0">Admin Control Center</h2>
            <span class="badge bg-danger px-3 py-2 text-uppercase letter-spacing-1">Live Analytics</span>
        </div>
    </section>

    <!-- Main Analytics Content -->
    <main class="container mb-5 flex-grow-1">
        
        <!-- Numerical Stats Blocks -->
        <h4 class="fw-bold mb-3">System Statistics</h4>
        <div id="admin-stats" class="mb-5">
            <!-- Dynamically populated via JS -->
            <div class="row">
                <div class="col text-center py-4"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <!-- Global Order Log Table -->
        <div class="card-premium p-4 shadow-sm">
            <h5 class="fw-bold mb-4">All System Orders Log</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light text-secondary small">
                        <tr>
                            <th scope="col">Order ID</th>
                            <th scope="col">Customer ID</th>
                            <th scope="col">Restaurant ID</th>
                            <th scope="col">Items Ordered</th>
                            <th scope="col">Final Cost</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody id="active-orders-tbody" class="small">
                        <!-- Populated via JS -->
                        <tr><td colspan="6" class="text-center text-muted">Loading orders data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 QuickBites. College Project.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom app JS -->
    <script src="js/app.js"></script>
</body>
</html>
