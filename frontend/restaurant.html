<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - QuickBites</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom style -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamically Loaded Navbar -->
    <div id="navbar-container"></div>

    <!-- Restaurant Header Banner -->
    <section class="bg-dark text-white py-5 mb-5" style="background: linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.95)), radial-gradient(circle, rgba(30,41,59,1) 0%, rgba(15,23,42,1) 100%);">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html" class="text-white-50 text-decoration-none">Restaurants</a></li>
                    <li class="breadcrumb-item active text-white" aria-current="page">Menu</li>
                </ol>
            </nav>
            <h1 class="fw-bold mb-2" id="restaurant-name">Loading Restaurant...</h1>
            <div id="restaurant-meta" class="d-flex align-items-center flex-wrap gap-2">
                <!-- Populated via JS -->
            </div>
        </div>
    </section>

    <!-- Menu Items -->
    <main class="container mb-5">
        <h3 class="fw-bold mb-4">Our Menu</h3>
        <div class="row" id="menu-container">
            <!-- Dynamically populated via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 QuickBites. College Project.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom app JS -->
    <script src="js/app.js"></script>
</body>
</html>
